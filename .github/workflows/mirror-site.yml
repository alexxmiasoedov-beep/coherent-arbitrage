name: Mirror romanovdecor.by into repo

on:
  push:
    branches: [claude/microcement-website-project-lgaus5]
    paths: ['.github/workflows/mirror-site.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the website
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          wget --mirror --page-requisites --no-parent -e robots=off \
               --user-agent="$UA" --tries=3 --timeout=30 \
               https://romanovdecor.by/ || true
          if [ ! -d romanovdecor.by ]; then
            echo "::error::Download failed - no files were retrieved"
            exit 1
          fi
          echo "Downloaded files:"
          find romanovdecor.by -type f | head -100

      - name: Copy into microcement-site
        run: |
          find microcement-site -mindepth 1 ! -name README.md -delete 2>/dev/null || true
          mkdir -p microcement-site
          cp -r romanovdecor.by/. microcement-site/
          rm -rf romanovdecor.by

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add microcement-site
          git commit -m "Mirror romanovdecor.by into microcement-site [skip ci]" || echo "nothing to commit"
          git push
